<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tomiko — Links</title>
<meta name="description" content="Pesan kopi, lihat menu, dan temukan Tomiko di semua platform.">
<link rel="icon" href="mark.png">

<!-- Open Graph: how the link looks when shared on WhatsApp / IG / etc. -->
<meta property="og:title" content="Tomiko">
<meta property="og:description" content="Pesan kopi, lihat menu, dan temukan kami.">
<meta property="og:image" content="mark.png">
<meta property="og:type" content="website">

<style>
  :root{
    --green:#123120;
    --green-soft:#2A5138;
    --cream:#F6F0E2;
    --cream-deep:#EDE3CE;
    --amber:#C97E35;
    --radius:999px;
  }

  *{box-sizing:border-box}

  body{
    margin:0;
    min-height:100vh;
    padding:48px 16px 56px;
    background:var(--cream);
    /* retro print-dot texture, pure CSS, no image to load */
    background-image:radial-gradient(var(--cream-deep) 1px, transparent 1px);
    background-size:14px 14px;
    color:var(--green);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    -webkit-font-smoothing:antialiased;
  }

  .wrap{max-width:420px;margin:0 auto;text-align:center}

  .mark{
    width:84px;height:84px;
    display:grid;place-items:center;
    margin:0 auto 22px;
    background:var(--cream);
    border:2px solid var(--green);
    border-radius:50%;
    box-shadow:4px 4px 0 var(--green);
  }
  .mark img{width:46px;height:auto;display:block}

  .wordmark{width:200px;max-width:62%;height:auto;display:block;margin:0 auto 14px}

  .tagline{
    font-family:Georgia,"Times New Roman",serif;
    font-size:16px;line-height:1.5;
    margin:0 auto 34px;max-width:30ch;
    color:var(--green-soft);
  }

  .links{display:flex;flex-direction:column;gap:14px}

  /* The button. Hard offset shadow + press-down on tap = retro print feel. */
  .link{
    display:flex;align-items:center;gap:14px;
    min-height:58px;padding:14px 22px;
    background:var(--cream);
    border:2px solid var(--green);
    border-radius:var(--radius);
    box-shadow:4px 4px 0 var(--green);
    color:var(--green);
    font-size:16px;font-weight:600;letter-spacing:.2px;
    text-decoration:none;
    transition:transform .12s ease, box-shadow .12s ease, background .12s ease;
  }
  .link:hover,.link:focus-visible{
    background:var(--cream-deep);
    transform:translate(2px,2px);
    box-shadow:2px 2px 0 var(--green);
  }
  .link:active{transform:translate(4px,4px);box-shadow:0 0 0 var(--green)}
  .link:focus-visible{outline:3px solid var(--amber);outline-offset:3px}

  /* Highlight the one action you most want people to take. */
  .link.primary{background:var(--green);color:var(--cream);box-shadow:4px 4px 0 var(--amber)}
  .link.primary:hover,.link.primary:focus-visible{background:var(--green-soft);box-shadow:2px 2px 0 var(--amber)}

  .link svg{width:22px;height:22px;flex:none;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
  .link span{flex:1;text-align:left}
  .link .chev{width:16px;height:16px;opacity:.45}

  footer{margin-top:40px;font-size:12.5px;letter-spacing:.4px;color:var(--green-soft);opacity:.75}

  @media (prefers-reduced-motion:reduce){.link{transition:none}}
</style>
</head>
<body>

<!-- Icon set, drawn once, referenced by the buttons below -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-wa" viewBox="0 0 24 24"><path d="M3 21l1.6-4.3A8.3 8.3 0 1 1 7.9 20L3 21Z"/><path d="M8.8 9.2c.3 2.3 3.7 5.7 6 6l1.3-1.4-2-1.2-1 .8c-1-.4-2.1-1.5-2.5-2.5l.8-1-1.2-2-1.4 1.3Z"/></symbol>
  <symbol id="i-ig" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="5.5"/><circle cx="12" cy="12" r="4"/><circle cx="17.3" cy="6.7" r=".9" fill="currentColor" stroke="none"/></symbol>
  <symbol id="i-tt" viewBox="0 0 24 24"><path d="M15 4c.6 2.4 2.1 3.8 4.5 4v3c-1.7 0-3.2-.5-4.5-1.4V15a5.6 5.6 0 1 1-5.6-5.6c.3 0 .6 0 .9.1v3.1a2.6 2.6 0 1 0 1.8 2.5V4H15Z"/></symbol>
  <symbol id="i-map" viewBox="0 0 24 24"><path d="M12 21s7-5.6 7-11a7 7 0 1 0-14 0c0 5.4 7 11 7 11Z"/><circle cx="12" cy="10" r="2.6"/></symbol>
  <symbol id="i-bag" viewBox="0 0 24 24"><path d="M5 8h14l-1.1 11.2a2 2 0 0 1-2 1.8H8.1a2 2 0 0 1-2-1.8L5 8Z"/><path d="M9 8V6.5a3 3 0 0 1 6 0V8"/></symbol>
  <symbol id="i-menu" viewBox="0 0 24 24"><path d="M6 3h12v18H6z"/><path d="M9.5 8h5M9.5 12h5M9.5 16h3"/></symbol>
  <symbol id="i-chev" viewBox="0 0 24 24"><path d="m9 5 7 7-7 7"/></symbol>
</svg>

<main class="wrap">

  <div class="mark"><img src="mark.png" alt=""></div>
  <img class="wordmark" src="wordmark.png" alt="Tomiko">
  <p class="tagline">Kopi yang dibikin pelan-pelan. Pesan, mampir, atau kepoin kami di bawah.</p>

  <!-- ===================================================================
       EDIT YOUR LINKS HERE
       To add a link: copy one whole <a>...</a> block and change 3 things —
         1. href="..."          the destination URL
         2. <span>...</span>    the button text
         3. xlink:href="#i-.."  the icon (i-wa, i-ig, i-tt, i-map, i-bag, i-menu)
       To remove a link: delete its whole <a>...</a> block.
       Put class="link primary" on the ONE link you want to stand out.
       =================================================================== -->
  <nav class="links">

    <a class="link primary" href="https://wa.me/628XXXXXXXXXX?text=Halo%20Tomiko%2C%20mau%20pesan" target="_blank" rel="noopener">
      <svg><use xlink:href="#i-wa"></use></svg><span>Pesan via WhatsApp</span><svg class="chev"><use xlink:href="#i-chev"></use></svg>
    </a>

    <a class="link" href="https://instagram.com/GANTI_USERNAME" target="_blank" rel="noopener">
      <svg><use xlink:href="#i-ig"></use></svg><span>Instagram</span><svg class="chev"><use xlink:href="#i-chev"></use></svg>
    </a>

    <a class="link" href="https://tiktok.com/@GANTI_USERNAME" target="_blank" rel="noopener">
      <svg><use xlink:href="#i-tt"></use></svg><span>TikTok</span><svg class="chev"><use xlink:href="#i-chev"></use></svg>
    </a>

    <a class="link" href="https://maps.google.com/?q=GANTI_ALAMAT" target="_blank" rel="noopener">
      <svg><use xlink:href="#i-map"></use></svg><span>Lokasi &amp; Jam Buka</span><svg class="chev"><use xlink:href="#i-chev"></use></svg>
    </a>

    <a class="link" href="https://gofood.co.id/GANTI_LINK" target="_blank" rel="noopener">
      <svg><use xlink:href="#i-bag"></use></svg><span>GoFood</span><svg class="chev"><use xlink:href="#i-chev"></use></svg>
    </a>

    <a class="link" href="https://food.grab.com/GANTI_LINK" target="_blank" rel="noopener">
      <svg><use xlink:href="#i-bag"></use></svg><span>GrabFood</span><svg class="chev"><use xlink:href="#i-chev"></use></svg>
    </a>

    <a class="link" href="menu.pdf" target="_blank" rel="noopener">
      <svg><use xlink:href="#i-menu"></use></svg><span>Lihat Menu</span><svg class="chev"><use xlink:href="#i-chev"></use></svg>
    </a>

  </nav>

  <footer>© <span id="y">2026</span> Tomiko</footer>
</main>

<script>document.getElementById('y').textContent=new Date().getFullYear()</script>
</body>
</html>
